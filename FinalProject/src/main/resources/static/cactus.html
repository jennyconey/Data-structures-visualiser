<h1>Cactus Stack</h1>
<body>
<div class="form-container">

    <div class="form-row">


        <form id="pushStack">
            <label for="pushInput">Enter an integer:</label>
            <input type="number" id="pushInput" required>
            <button type="button" onclick="pushStack()">push(x)</button>
            <script src="cactus.js"></script>

        </form>

        <form id="popStack">
            <button type="button" onclick="popStack()">pop()</button>
            <script src="cactus.js"></script>
        </form>


        <form id="newBranch">
            <label for="branchInput">Enter an integer:</label>
            <input type="number" id="branchInput" required>

            <button type="button" onclick="newBranch()">branch(i,x)</button>
            <script src="cactus.js"></script>

        </form>

        <form id="pushBranch">
            <label for="branchInput">Enter an integer:</label>
            <input type="number" id="branchPush" required>
            <button type="button" onclick="pushBranch()">pushBranch(i,x)</button>
            <script src="cactus.js"></script>

        </form>

    </div>
</div>
