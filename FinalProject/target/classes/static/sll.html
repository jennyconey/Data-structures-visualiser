<h1>Singly Linked List</h1>
<body>

<div class="form-container">

    <div class="form-row">


        <form id="createList">
            <label for="createInput">Enter values (comma-separated):</label>
            <input type="text" id="createInput" required>
            <button type="button" onclick="createList()">build(x)</button>
            <script src="sll.js"></script>

        </form>

        <form id="insert">

            <label for="insertValueInput">Enter value:</label>
            <input type="number" id="insertValueInput" required>

            <label for="insertIndexInput">Enter index:</label>
            <input type="number" id="insertIndexInput" required>


            <button type="button" onclick="insertElement()">insert_at(i,x)</button>
            <script src="sll.js"></script>

        </form>

        <form id="remove">

            <label for="removeInput">Enter Index:</label>
            <input type="number" id="removeInput" required>


            <button type="button" onclick="removeElement()">remove_at(i)</button>
            <script src="sll.js"></script>

        </form>
    </div>
</div>
