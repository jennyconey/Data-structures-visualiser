<h1>Array</h1>

<body>
<div class="form-container">
    <div class="form-row">

        <form id="arrayCreate">
            <label for="createInput">Enter values (comma-separated):</label>
            <input type="text" id="createInput" required>
            <button type="button" onclick="createArray()">Build(x)</button>
            <script src="array.js"></script>

        </form>

        <form id="arrayAppend">
            <label for="insertValueInput">Enter value:</label>
            <input type="number" id="insertValueInput" required>

            <label for="insertIndexInput">Enter index:</label>
            <input type="number" id="insertIndexInput" required>


            <button type="button" onclick="appendArray()">set_at(i,x)</button>
            <script src="array.js"></script>

        </form>

        <form id="arrayRemove">

            <label for="removeIndexInput">Enter index:</label>
            <input type="number" id="removeIndexInput" required>

            <button type="button" onclick="removeElement()">remove()</button>
            <script src="array.js"></script>

        </form>
    </div>
</div>

<div style="text-align: center">
    <canvas id="canvas" width="800" height="500"></canvas>
    <script src="array.js"></script>

</div>

</body>
