<h1>Stack</h1>
<body>

<div class="form-container">

    <div class="form-row">


        <form id="buildStack">
            <label for="buildInput">Enter values (comma-separated):</label>
            <input type="text" id="buildInput" required>
            <button type="button" onclick="buildStack()">Build(x)</button>
            <script src="stack.js"></script>

        </form>

        <form id="pushStack">
            <label for="pushInput">Enter an integer:</label>
            <input type="number" id="pushInput" required>
            <button type="button" onclick="pushStack()">push()</button>
            <script src="stack.js"></script>

        </form>
        <form id="popStack">

            <button onclick="popStack()">pop()</button>
            <script src="stack.js"></script>
        </form>

    </div>
</div>

<dl>

    <dt>pop() </dt>
    <dd>remove and return the top of the stack </dd>
    <dt>peek() </dt>
    <dd>return (without removing) the top of the stack</dd>
    <dt> build(X) </dt>
    <dd> build a new stack</dd>
